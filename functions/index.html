<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="startTimer()">start timer</button>
     <button onclick="stopTimer()">stop timer</button>
     <div id="blank">

     </div>
     <script>
        let timer;
        function startTimer(){
            timer=setTimeout(function(){
            document.getElementById("blank").innerHTML="finished"},5000)
        }
        function stopTimer(){
            clearTimeout(timer)
            document.getElementById("blank").innerHTML="timer has stoped";
        }
     </script>
</body>
</html>
