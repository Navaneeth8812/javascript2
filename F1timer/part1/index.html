<body>
    <div id="1" class="display"></div>
    <div id="2" class="display"></div>

    <div id="5" class="display"></div> 
    <button onclick="displayCol()">start simulate</button>
    <div class="content">
        <p>press space to stop</p>
    </div>

    <script>
    function displayCol(){
        let interval = setTimeout(function(){
            num1(1);
        },1000)
        let interval2 = setInterval(function(){
            num1(2);
        },2000);
        let interval3 = setInterval(function(){
            num1(3);
        },3000);
        let interval4 = setInterval(function(){
            num1(4);
        },4000)
        let interval5 = setInterval(function(){
            num1(5);
        },5000)
    }
    function num1(elementId){
        document.getElementById(elementId).style.background="red";
    }  
    
    </script>
