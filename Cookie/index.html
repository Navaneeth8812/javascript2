<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kids web</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <h1>kids web</h1>
    <div class="cookie" id="cookie">
        <div class="icon">
        <div>
            <i class="fa-solid fa-cookie-bite"></i>
        </div>
        <button class="icon-btn" id="cross" ">
              <i class="fa-solid fa-x cross"></i>
        </button>
        </div>
        <div class="content">
            <p>we use cookies to improve your user experience</p>
            <button id="cook-btn" class="cookie-btn">I like cookies</button>
        </div>
        
    </div>
    <script>
        const closeBtn = document.getElementById('cross');
        const acceptBtn = document.getElementById('cook-btn')
        function close(){
            document.getElementById('cookie').style.display='none';
        }
        closeBtn.addEventListener('click', ()=>{
            close();
        });
         acceptBtn.addEventListener('click', ()=>{
            close();
        });
    </script>
</body>
</html>
